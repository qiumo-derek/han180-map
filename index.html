<div id="map" aria-label="十三州地图"></div>
<aside class="rail">
 <div class="title"><div class="eyebrow">HAN DYNASTY · AD 180</div><h1>汉末十三州</h1><div class="subtitle">同州同色 · 州界为纲 · 郡县递进</div><div class="stats"><div><b>13</b><span>州级区域</span></div><div><b id="cellCount">—</b><span>POI 分区</span></div><div><b id="poiStates">—</b><span>州已有点</span></div></div></div>
 <div class="block"><div class="section-line">十三州 <small>点击定位</small></div><nav class="states" id="stateList" aria-label="选择州"></nav></div>
 <div class="block controls"><div class="section-line">地图层级</div>
  <label><input id="ly-states" type="checkbox" checked><span class="swatch" style="background:#44896f"></span>州域分色</label>
  <label><input id="ly-jun" type="checkbox" checked><span class="key-line thin"></span>现有郡界</label>
  <label><input id="ly-cells" type="checkbox" checked><span class="key-line"></span>POI 初分边界</label>
  <label><input id="curved" type="checkbox" checked><span style="font-size:13px">∿</span>圆润边界 <small style="color:#82969f">关掉对比直线</small></label>
  <label><input id="ly-poi" type="checkbox" checked><span class="key-dot"></span>已确认城邑 POI</label>
  <label><input id="ly-labels" type="checkbox" checked><span style="font-size:11px">州</span>地名标签</label>
  <label><input id="ly-modern" type="checkbox"><span class="key-line dash"></span>现代县界参照</label>
 </div>
 <div class="rail-footer">源边界：「180验证版」· 共享圆角<br>点位：现有已确认县城、郡城<br><a href="县界数据.json" download>县界 JSON</a> · <a href="POI分区明细.csv" download>分区明细</a> · <a href="考据与交付说明.md" target="_blank">考据说明</a></div>
</aside>
<div class="toolbar"><button id="home">十三州全图</button><button id="jing" class="accent">荆州细分</button><button id="jiao">交州 5 点</button><button id="reviewBtn">考据 / 待核对</button><input id="query" aria-label="搜索地名" placeholder="搜索州 / 郡 / 县名"><button id="find">查找</button></div>
<div id="details" aria-live="polite"></div>
<div id="review"><button id="reviewClose" aria-label="关闭考据">×</button><h2>分区依据与待核对项</h2><div id="reviewContent"></div></div>
<div class="bottom"><span class="note">POI 初分 · 共享曲线 · 现有郡界约束；尚未按山川考证县界</span><span class="note" id="status">加载中…</span></div>
<script src="vendor/leaflet.js"></script><script src="data/map-data.js"></script><script src="data/modern-counties.js"></script>
<script>
'use strict';
const D=window.HAN180, $=s=>document.getElementById(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const map=L.map('map',{zoomControl:false,minZoom:3,maxZoom:12,preferCanvas:true,zoomSnap:.25,attributionControl:true});
L.control.zoom({position:'topright'}).addTo(map);L.control.scale({position:'bottomright',imperial:false}).addTo(map);
map.attributionControl.setPrefix(false);map.attributionControl.addAttribution('州郡 / POI © 本地 MapAligner 工程 · 现代县界 © DataV / g0v');
for(const [n,z] of [['statefill',300],['modern',310],['cells',330],['jun',350],['statehalo',370],['stateborder',380],['pois',410],['labels',450]]){map.createPane(n).style.zIndex=z;}
for(const n of ['jun','statehalo','stateborder','labels']) map.getPane(n).style.pointerEvents='none';
let active='',selectedCell=null;const stateLayers={},cellLayers={},pointLayers={},junLayers={};
const fill=L.geoJSON(D.states,{pane:'statefill',smoothFactor:.2,style:f=>({fillColor:f.properties.color,fillOpacity:.72,color:f.properties.color,weight:.4,opacity:.2}),onEachFeature:(f,l)=>{stateLayers[f.properties.name]=l;l.on('click',()=>focusState(f.properties.name));}}).addTo(map);
const modern=L.geoJSON(window.MODERN_COUNTIES,{pane:'modern',interactive:false,style:{fill:false,color:'#b5c1c4',weight:.4,opacity:.28}});
const jun=L.geoJSON(D.commanderies,{pane:'jun',interactive:false,smoothFactor:.2,style:{fill:false,color:'#e6d5aa',weight:.8,opacity:.6},onEachFeature:(f,l)=>junLayers[f.properties.uid]=l}).addTo(map);
const halo=L.geoJSON(D.states,{pane:'statehalo',interactive:false,smoothFactor:.2,style:{fill:false,color:'#0a151b',weight:4.3,opacity:.94}}).addTo(map);
const borders=L.geoJSON(D.states,{pane:'stateborder',interactive:false,smoothFactor:.2,style:{fill:false,color:'#e0d5b4',weight:1.6,opacity:.9}}).addTo(map);
const cells=L.geoJSON(D.partitions,{pane:'cells',smoothFactor:.15,style:f=>({fillColor:'#f2f2cb',fillOpacity:.025,color:'#d7e9db',weight:.85,opacity:.73}),onEachFeature:(f,l)=>{cellLayers[f.properties.uid]=l;l.bindTooltip(`<b>${esc(f.properties.name)}</b><br>${esc(f.properties.state)} · ${esc(f.properties.commandery)}<br><span class="mini">POI 距离初分${f.properties.conflict?' · 归属有核对项':''}</span>`,{sticky:true});l.on('click',()=>showCell(f,l));l.on('mouseover',()=>{if(l!==selectedCell)l.setStyle({fillOpacity:.17,weight:1.8})});l.on('mouseout',()=>{if(l!==selectedCell)cells.resetStyle(l)});}}).addTo(map);
const markerData=D.pois.features.filter(f=>f.properties.checked&&['county','commandery','prefecture'].includes(f.properties.poi_type));
const pois=L.geoJSON({type:'FeatureCollection',features:markerData},{pane:'pois',pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:'pois',radius:f.properties.poi_type==='county'?2.8:4.3,color:f.properties.conflict?'#f2c370':'#ecdfb9',weight:1.1,fillColor:f.properties.conflict?'#c48737':'#142821',fillOpacity:1}),onEachFeature:(f,l)=>{pointLayers[f.properties.uid]=l;l.bindTooltip(esc(f.properties.name),{direction:'top'});l.on('click',()=>{const cf=displayCells().features.find(c=>c.properties.uid===f.properties.uid);if(cf)showCell(cf,cellLayers[cf.properties.uid]);else detail(`<h2>${esc(f.properties.name)}</h2><div class="badges">原始州治记录</div><p>保留原点，不单独生成与江陵郡城重复的分区。</p><div class="notice">《后汉书》记荆州刺史治汉寿；原点的州治标注有待修订。</div>`);});}});
const stateLabels=L.layerGroup(),junLabels=L.layerGroup(),poiLabels=L.layerGroup();
const labelOverrides={'荆州':[29.4,111.45],'兖州':[35.2,116.1],'徐州':[33.65,118.55],'豫州':[33.05,114.8],'青州':[36.6,119.4],'冀州':[38.15,115.55],'并州':[37.6,112.05],'司隶':[34.65,109.45],'扬州':[28.5,117.8],'交州':[23.15,108.9],'益州':[29.5,102.5]};
function label(layer,ll,text,cls,width=80){L.marker(ll,{interactive:false,keyboard:false,pane:'labels',icon:L.divIcon({className:cls,html:esc(text),iconSize:[width,24],iconAnchor:[width/2,12]})}).addTo(layer);}
for(const f of D.states.features)label(stateLabels,labelOverrides[f.properties.name]||f.properties.label,f.properties.name,'state-label');
function regionLabelPoint(f){const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;let best=null,area=-1;for(const p of polys){const r=p[0];let a=0,sx=0,sy=0;for(let i=0;i<r.length-1;i++){const v=r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1];a+=v;sx+=(r[i][0]+r[i+1][0])*v;sy+=(r[i][1]+r[i+1][1])*v;}if(Math.abs(a)>area&&a!==0){area=Math.abs(a);best=[sy/(3*a),sx/(3*a)];}}return best;}
for(const f of D.commanderies.features){const ll=regionLabelPoint(f);if(ll)label(junLabels,ll,f.properties.name,'jun-label',90);}
for(const f of markerData)label(poiLabels,[f.geometry.coordinates[1],f.geometry.coordinates[0]],f.properties.name,'poi-label',100);
function on(layer,visible){if(visible&&!map.hasLayer(layer))layer.addTo(map);if(!visible&&map.hasLayer(layer))map.removeLayer(layer);}
function update(){const z=map.getZoom(),labels=$('ly-labels').checked;fill.setStyle(f=>({fillOpacity:$('ly-states').checked?.72:0}));on(jun,$('ly-jun').checked);on(cells,$('ly-cells').checked);on(modern,$('ly-modern').checked);on(pois,$('ly-poi').checked&&z>=5.8);on(stateLabels,labels&&z<7);on(junLabels,labels&&$('ly-jun').checked&&z>=6.3&&z<8.4);on(poiLabels,labels&&$('ly-poi').checked&&z>=8.1);$('status').textContent=`${active||'十三州全图'} · 缩放 ${z.toFixed(1)} · 可点击分区`;}
function padding(){return window.innerWidth<700?{paddingTopLeft:[160,85],paddingBottomRight:[18,65]}:{paddingTopLeft:[276,75],paddingBottomRight:[50,55]};}
function selectState(name){active=name;document.querySelectorAll('.state').forEach(b=>b.classList.toggle('active',b.dataset.state===name));if(selectedCell)cells.resetStyle(selectedCell);selectedCell=null;}
function home(){selectState('');$('details').style.display='none';map.fitBounds(fill.getBounds(),{...padding(),animate:false});update();}
function focusState(name){const l=stateLayers[name];if(!l)return;selectState(name);map.fitBounds(l.getBounds(),{...padding(),animate:false});document.querySelectorAll('.state').forEach(b=>b.classList.toggle('active',b.dataset.state===name));const p=l.feature.properties;detail(`<h2>${esc(name)}</h2><div class="badges">180 年工程底图 · 同州同色</div><p>现有郡级图形：${p.region_count} 个<br>已生成 POI 分区：${p.partition_count} 个</p>${p.partition_count?'<p>点击细分区域，可查看对应城邑及原始归属。放大显示郡名与县名。</p>':'<p>当前工程在该州没有可用于细分的已确认县城、郡城点，保留现有州郡轮廓。</p>'}<div class="mini">州郡轮廓沿用工程并作共享圆角；郡名尚未全部通过 180 年年代校订。</div>`);update();}
function detail(html){$('details').innerHTML='<button class="close" aria-label="关闭详情">×</button>'+html;$('details').style.display='block';$('details').querySelector('.close').onclick=()=>{$('details').style.display='none';};}
function showCell(f,l){if(selectedCell)cells.resetStyle(selectedCell);selectedCell=l;l.setStyle({fillOpacity:.22,weight:2,color:'#fff2c5'});const p=f.properties;detail(`<h2>${esc(p.name)}</h2><div class="badges">${esc(p.state)} · ${esc(p.commandery)} · POI 初分</div><p>对应点：${esc(p.str_id)}<br>投影面积约 ${p.area_km2.toLocaleString()} km²<br>原始标注：${esc(p.source_state)} · ${esc(p.source_commandery)}</p>${p.review?`<div class="notice">${esc(p.review)}</div>`:''}<p class="mini">以点间距离为基础，共享边界作缓弯处理，再裁切到工程郡界；未据河流、山脊重建真实县界。</p>`);$('status').textContent=`已选择 ${p.name} · ${p.state} ${p.commandery}`;}
for(const f of D.states.features){const p=f.properties,b=document.createElement('button');b.className='state';b.dataset.state=p.name;b.innerHTML=`<i class="swatch" style="background:${p.color}"></i>${esc(p.name)}${p.partition_count?`<small>${p.partition_count}</small>`:''}`;b.onclick=()=>focusState(p.name);$('stateList').append(b);}
function find(){
 const q=$('query').value.trim();if(!q)return;
 if(stateLayers[q]){focusState(q);return;}
 const exactJun=D.commanderies.features.find(f=>f.properties.name===q);
 const exactCell=displayCells().features.find(f=>f.properties.name===q);
 const f=exactCell||(!exactJun&&displayCells().features.find(f=>f.properties.name.includes(q)));
 if(f){map.fitBounds(cellLayers[f.properties.uid].getBounds(),{...padding(),maxZoom:9,animate:false});selectState(f.properties.state);update();showCell(f,cellLayers[f.properties.uid]);return;}
 const j=exactJun||D.commanderies.features.find(f=>f.properties.name.includes(q));
 if(j){map.fitBounds(junLayers[j.properties.uid].getBounds(),{...padding(),animate:false});selectState(j.properties.state);update();detail(`<h2>${esc(j.properties.name)}</h2><div class="badges">${esc(j.properties.state)} · 工程郡界</div><p>郡名沿用工程来源，部分名称待年代校核。</p>`);return;}
 $('status').textContent='没有找到：'+q;
}
$('home').onclick=home;$('jing').onclick=()=>focusState('荆州');$('jiao').onclick=()=>{const fs=D.partitions.features.filter(f=>f.properties.state==='交州');const bounds=L.latLngBounds(fs.map(f=>f.properties.seed));map.fitBounds(bounds.pad(.6),{...padding(),animate:false});selectState('交州');update();detail('<h2>交州 · 苍梧郡</h2><div class="badges">5 个已标记点已参与划分</div><p>荔浦、临贺、富川、冯乘、谢沐。</p><div class="notice">原表将这 5 点标为荆州零陵郡；空间落点与《后汉书·郡国五》均归入交州苍梧郡。原始文件未改。</div><p class="mini">仅按已有 5 点对该郡作距离初分，县城名单仍不齐备。</p>');};
$('find').onclick=find;$('query').addEventListener('keydown',e=>{if(e.key==='Enter')find();});document.querySelectorAll('.controls input').forEach(el=>el.onchange=update);map.on('zoomend',update);
function displayCells(){return $('curved').checked?D.partitions:D.straight;}
$('curved').onchange=()=>{const uid=selectedCell?.feature.properties.uid;selectedCell=null;cells.clearLayers();cells.addData(displayCells());const states=$('curved').checked?D.states:D.original_states;fill.clearLayers();fill.addData(states);halo.clearLayers();halo.addData(states);borders.clearLayers();borders.addData(states);jun.clearLayers();jun.addData($('curved').checked?D.commanderies:D.original_commanderies);update();if(uid)showCell(cellLayers[uid].feature,cellLayers[uid]);};
$('cellCount').textContent=D.meta.partition_count;$('poiStates').textContent=Object.keys(D.meta.partition_states).length;
$('reviewContent').innerHTML=`<p>这版直接读取你现有的州郡轮廓，以十三州分色。共 ${D.meta.partition_count} 个城邑点参与初分：荆州 140 个、交州 5 个。</p><h3>哪些分界是现成的</h3><p>州界、郡界来自工程「180验证版」，以共享圆角柔化折点；白色细分线由城邑点间距离生成，共享边界统一曲线化，再裁切到郡界。可关掉「圆润边界」与直线版对比。它们是可继续修订的初分，不代表已经考证的古县界。</p><h3>考据发现</h3><ul><li>荔浦等 5 点应核入交州苍梧郡，已在预览中按落点处理。</li><li>江陵原点被标为州治；《后汉书》记荆州刺史治汉寿。此点保留但不重复生成分区。</li><li>原工程部分郡名有年代混用，先保持轮廓，不把文件名视为完成考据的证明。</li></ul><p><a href="https://zh.wikisource.org/zh-hans/後漢書/卷112" target="_blank">《后汉书·郡国四》</a> · <a href="https://zh.wikisource.org/zh-hans/後漢書/卷113" target="_blank">《后汉书·郡国五》</a></p><h3>原标注与落点不同的 9 项</h3>${D.meta.conflicts.map(p=>`<div class="review-item"><b>${esc(p.name)}</b><br><span>原：${esc(p.prefecture)} / ${esc(p.commandery)}<br>落点：${esc(p.spatial_state)} / ${esc(p.spatial_commandery)}</span></div>`).join('')}<p class="mini">预览按空间落点划分；原始 POI 和工程均保留。已修补州郡接缝并清理重叠，直线与圆润版本均已同步。此为工程几何修补，历史归属仍需考据。</p>`;
